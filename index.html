<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfbfd" />
    <meta
      name="description"
      content="Portfolio of Tao (Tony) Jin | Business Analyst & Data Strategist"
    />
    <title>Tao (Tony) Jin | Data Analyst Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              page: '#fbfbfd',
              surface: '#ffffff',
              muted: '#f5f5f7',
              ink: {
                DEFAULT: '#1d1d1f',
                secondary: '#424245',
                tertiary: '#6e6e73',
              },
              hairline: '#d2d2d7',
              accent: {
                DEFAULT: '#0066CC',
                hover: '#0077ED',
                soft: '#eaf3ff',
              },
            },
            fontFamily: {
              sans: [
                '-apple-system',
                'BlinkMacSystemFont',
                '"SF Pro Display"',
                '"SF Pro Text"',
                'Inter',
                'system-ui',
                'sans-serif',
              ],
            },
            borderRadius: {
              card: '18px',
              'card-lg': '22px',
              pill: '9999px',
            },
            boxShadow: {
              card: '0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04)',
              lift: '0 8px 32px rgba(0,0,0,0.06)',
            },
            letterSpacing: {
              display: '-0.03em',
              tighter: '-0.025em',
              title: '-0.022em',
              headline: '-0.01em',
              eyebrow: '0.06em',
            },
            fontSize: {
              eyebrow: ['0.75rem', { lineHeight: '1.35', fontWeight: '600' }],
              body: ['1.0625rem', { lineHeight: '1.55', fontWeight: '400' }],
              'body-lg': ['1.3125rem', { lineHeight: '1.45', fontWeight: '400' }],
              headline: ['1.375rem', { lineHeight: '1.2', fontWeight: '600' }],
              title: ['2.5rem', { lineHeight: '1.08', fontWeight: '600' }],
              'display-lg': ['3.5rem', { lineHeight: '1.0', fontWeight: '600' }],
              'display-xl': ['4.5rem', { lineHeight: '0.97', fontWeight: '600' }],
            },
            transitionTimingFunction: {
              apple: 'cubic-bezier(0.28, 0.11, 0.32, 1)',
            },
            maxWidth: {
              content: '980px',
              grid: '1200px',
            },
          },
        },
      }
    </script>
    <!-- Fonts (Inter fallback for non-Apple systems) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
        background-color: #fbfbfd;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      ::selection {
        background: rgba(0, 102, 204, 0.18);
        color: #1d1d1f;
      }

      /* Apple-style utility classes (Tailwind CDN cannot @apply here) */
      .glass-nav {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .btn-apple {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #0066CC;
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        line-height: 1;
        padding: 0.875rem 1.5rem;
        border-radius: 9999px;
        transition: background-color 240ms cubic-bezier(0.28, 0.11, 0.32, 1), transform 240ms cubic-bezier(0.28, 0.11, 0.32, 1);
      }
      .btn-apple:hover {
        background: #0077ED;
      }
      .btn-apple:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.4);
      }
      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        color: #0066CC;
        font-weight: 500;
        font-size: 15px;
        line-height: 1;
        padding: 0.875rem 1rem;
        border-radius: 9999px;
        transition: color 200ms;
      }
      .btn-ghost:hover {
        color: #0077ED;
      }
      .btn-ghost:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.4);
      }
      .card-apple {
        background: #ffffff;
        border: 1px solid #d2d2d7;
        border-radius: 22px;
        transition: box-shadow 320ms cubic-bezier(0.28, 0.11, 0.32, 1), transform 320ms cubic-bezier(0.28, 0.11, 0.32, 1);
      }
      .card-apple:hover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        transform: translateY(-2px);
      }

      /* Frosted glass card — Apple depth */
      .glass-card {
        position: relative;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.78) 0%,
          rgba(255, 255, 255, 0.52) 100%
        );
        backdrop-filter: saturate(180%) blur(24px);
        -webkit-backdrop-filter: saturate(180%) blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 22px;
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.03),
          0 8px 24px rgba(17, 24, 39, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        transition:
          transform 320ms cubic-bezier(0.28, 0.11, 0.32, 1),
          box-shadow 320ms cubic-bezier(0.28, 0.11, 0.32, 1),
          border-color 320ms cubic-bezier(0.28, 0.11, 0.32, 1);
      }
      .glass-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0)
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }
      .glass-card:hover {
        transform: translateY(-3px);
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.03),
          0 20px 48px rgba(17, 24, 39, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        border-color: rgba(255, 255, 255, 0.9);
      }

      /* Glass chip — small translucent pill */
      .glass-chip {
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.03),
          0 4px 14px rgba(17, 24, 39, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* Apple Intelligence style gradient text */
      .text-gradient-apple {
        background: linear-gradient(135deg, #0066CC 0%, #5856D6 50%, #AF52DE 100%);
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
      }

      /* Ambient gradient orb helper (used via inline styles for position) */
      .orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(140px);
        pointer-events: none;
        will-change: transform, opacity;
      }
      .eyebrow {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6e6e73;
      }
      .fade-up {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 600ms cubic-bezier(0.28, 0.11, 0.32, 1), transform 600ms cubic-bezier(0.28, 0.11, 0.32, 1);
      }
      .fade-up.in-view {
        opacity: 1;
        transform: translateY(0);
      }

      /* Print — HR-friendly export */
      @media print {
        nav, .no-print { display: none !important; }
        * {
          box-shadow: none !important;
          background: transparent !important;
          color: #000 !important;
          border-color: #999 !important;
        }
        body { background: #ffffff !important; }
        section, article { page-break-inside: avoid; padding: 12px 0 !important; }
        a[href^="http"]::after,
        a[href^="mailto"]::after {
          content: " (" attr(href) ")";
          font-size: 10px;
          color: #444;
        }
        .fade-up { opacity: 1 !important; transform: none !important; }
      }

      /* Respect user motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        .fade-up { opacity: 1 !important; transform: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
